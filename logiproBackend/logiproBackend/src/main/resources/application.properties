spring.application.name=logiproBackend

# Importa variables desde .env (si existe)
spring.config.import=optional:file:.env[.properties]

# --- MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Logs ---
logging.level.org.hibernate.SQL=${LOG_SQL_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_SQL_BIND_LEVEL:TRACE}

# --- JWT / Seguridad ---
app.jwt.issuer=${JWT_ISSUER}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=${JWT_ACCESS_TTL}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL}

# --- Proxy ---
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- SMTP / Mail ---
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Remitente por defecto de los correos
app.mail.from=${MAIL_FROM}

# Timeouts (opcionales)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
