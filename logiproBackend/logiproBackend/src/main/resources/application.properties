spring.application.name=logiproBackend
# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/logipro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# (Opcional) Hibernate 6 suele autodetectar dialecto; si querés fijarlo:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Swagger / OpenAPI (opcional) ---
# springdoc.swagger-ui.path=/swagger-ui.html
# springdoc.api-docs.path=/api-docs

# --- Logs (opcional y útil) ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# === JWT / Seguridad (DEV) ===
app.jwt.issuer=logipro-app
# Usá una clave LARGA. Acá dejamos un placeholder que podés reemplazar por una var de entorno:
app.jwt.secret=FYLKPhWe9aMeJ1LYExrIwdp7PCHfDJaxqvOMFdfUFSo=
# Tiempos (ISO-8601): 15 minutos access, 7 días refresh
app.jwt.access-ttl=PT15M
app.jwt.refresh-ttl=P7D

# Detrás de proxy (dev/prod): preserva headers X-Forwarded-* correctamente
server.forward-headers-strategy=framework

# === CORS (ajustaremos en Security más adelante, pero dejamos orígenes para referencia) ===
app.cors.allowed-origins=http://localhost:5173
